<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404-Page</title>


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
        }


        .error-404-section {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            overflow: hidden;
            text-align: center;
            padding: 20px 5%;
        }

        .error-bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1574680096145-d05b474e2155?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
            filter: grayscale(90%) contrast(1.3) blur(3px);
            z-index: 1;
        }

        .error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(10, 10, 10, 0.7) 0%, rgba(10, 10, 10, 0.95) 100%);
            z-index: 2;
        }

        .error-container {
            position: relative;
            z-index: 3;
            max-width: 700px;
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 69, 0, 0.2);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 69, 0, 0.1);
        }

        .error-glitch-text {
            font-size: 150px;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 3px #FF4500;
            text-shadow: 0 0 40px rgba(255, 69, 0, 0.5);
            line-height: 1;
            margin-bottom: -10px;
            letter-spacing: 5px;
        }

        .error-title {
            font-size: 45px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .neon-text {
            color: #FF4500;
            text-shadow: 0 0 20px rgba(255, 69, 0, 0.6);
        }

        .error-desc {
            font-size: 17px;
            color: #cccccc;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .error-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn-primary-glow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #FF4500;
            color: #ffffff;
            border: 2px solid #FF4500;
            padding: 16px 35px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.4);
            cursor: pointer;
        }

        .btn-primary-glow:hover {
            background: transparent;
            color: #FF4500;
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.8);
            transform: translateY(-3px);
        }

        .btn-secondary-glow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: transparent;
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 16px 35px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .btn-secondary-glow:hover {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-3px);
        }


        @media (max-width: 768px) {
            .error-glitch-text {
                font-size: 100px;
            }

            .error-title {
                font-size: 32px;
            }

            .error-container {
                padding: 40px 20px;
            }

            .error-actions {
                flex-direction: column;
                gap: 15px;
            }

            .btn-primary-glow,
            .btn-secondary-glow {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <section class="error-404-section">
        <div class="error-bg-image"></div>
        <div class="error-overlay"></div>

        <div class="error-container gsap-error-box">
            <div class="error-glitch-text">404</div>
            <h2 class="error-title">WRONG <span class="neon-text">TERRITORY</span></h2>

            <p class="error-desc">
                Even the most disciplined athletes take a wrong turn sometimes. The page you are looking for has been
                moved, deleted, or never existed in our system.
            </p>

            <div class="error-actions">
                <button onclick="window.history.back();" class="btn-secondary-glow">
                    <i class="fa-solid fa-arrow-rotate-left"></i> Go Back
                </button>
                <a href="index.html" class="btn-primary-glow">
                    Return to Base <i class="fa-solid fa-house"></i>
                </a>
            </div>
        </div>
    </section>


</body>

</html>
